name: Dependency freshness

on:
  push:
    paths:
      - dependency-policy.json
      - go.mod
      - go.sum
      - web/package.json
      - web/package-lock.json
      - Dockerfile
      - scripts/report-dependency-freshness.mjs
      - scripts/security-scan.sh
      - .github/workflows/**
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-freshness
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the locked Node dependency graph
        run: npm ci --prefix web

      - name: Detect stable dependency candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/report-dependency-freshness.mjs \
            --format markdown \
            --output dependency-freshness.md
          status=$?
          if [[ -f dependency-freshness.md ]]; then
            cat dependency-freshness.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
