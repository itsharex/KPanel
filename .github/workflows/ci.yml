name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Type-check frontend
        working-directory: web
        run: npm run typecheck

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Test backend
        run: go test ./...

      - name: Vet backend
        run: go vet ./...

      - name: Cross-build Linux binaries
        run: make build-linux

      - name: Verify deployment safety
        run: sh deploy/tests/install-safety.sh

      - name: Build runtime image
        run: docker build --build-arg VERSION=ci -t kejilion-panel:ci .

      - name: Verify runtime image contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' kejilion-panel:ci)" = "65532:65532"
          test "$(docker image inspect --format '{{join .Config.Healthcheck.Test " "}}' kejilion-panel:ci)" = "CMD /paneld healthcheck"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' kejilion-panel:ci)" = "ci"
          container_id="$(
            docker run --detach --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
              --tmpfs /var/lib/kejilion-panel:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700 \
              kejilion-panel:ci
          )"
          cleanup() {
            docker container rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          healthy=false
          for _ in {1..20}; do
            if docker exec "$container_id" /paneld healthcheck >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 1
          done
          test "$healthy" = true
