name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run change-aware verification
        env:
          VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make verify-change

      - name: Verify kejilion.sh application lifecycle
        run: |
          docker run --rm \
            -e KPANEL_APP_CONF_TEST_ROOTFS=1 \
            -v "$PWD:/src:ro" \
            node:24.17.0-alpine@sha256:156b55f92e98ccd5ef49578a8cea0df4679826564bad1c9d4ef04462b9f0ded6 \
            sh -lc 'apk add --no-cache bash coreutils >/dev/null && bash /src/packaging/tests/app-conf-lifecycle.sh /src'
