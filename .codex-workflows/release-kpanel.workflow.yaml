# Release KPanel

## Purpose

把 KPanel 的 L3 发布链路固化为可重复执行、可验证、可回滚的流程。链路包括发布画像、版本准备、
发布候选与主仓库 CI、GitHub Release、Docker Hub 多架构镜像、`latest` 提升、
`kejilion/apps` 应用市场契约核对、公开镜像端到端验收，以及隔离真机/生产证据和统一验收记录。

## Prerequisites

- 已阅读 `AGENTS.md`、`PROJECT_RULES.md` 和 `docs/project-management.md`，并取得用户对本次
  发布、推送的明确授权。
- 发布范围已经由协调中心按精确提交哈希确认；当前只有一个发布任务、一个候选 worktree 和
  一个候选分支。新功能继续在独立分支开发，不得进入已冻结候选。
- 发布任务已在协调中心声明唯一负责人、候选分支和精确提交清单；主要实现任务与最终验证/发布任务
  相互独立。多个 AI 可用时，优先由另一种智能体复核提交清单、风险和回滚点。
- 源码 fetch/push 统一使用 SSH 远端；GitHub Issue、PR、API、插件和 `gh` 登录不是发布候选分支的
  前置条件。GitHub Actions/Release 继续使用仓库内置临时 Token 完成远端自动化。
- `${{project_dir}}` 是本次发布使用的独立、干净 KPanel 工作树，远端为
  `kejilion/KPanel`；不得切换到其他并发会话的工作树执行。
- `${{apps_repo}}` 指向 `kejilion/apps` 本地仓库，默认 `C:\GitHub\kejilion\apps`；只有
  `packaging/kejilion-app/kpanel.conf` 的安装/更新契约发生变化时才需要写入该仓库。
- GitHub 仓库已配置 `DOCKERHUB_TOKEN` Secret；Token 对 `${{image}}` 具有 Read & Write 权限。
- GitHub 仓库变量 `DOCKERHUB_IMAGE`、`DOCKERHUB_USERNAME` 与目标 Docker Hub 仓库一致。
- `release.yml` 的 Docker 登录不得限定仅 push 的 Buildx `scope`，因为 `latest` 提升同时需要
  拉取和推送清单的权限。
- 保留所有无关未提交改动；只提交本次发布范围内的文件。

## Steps

### 1. 预检发布状态

先列出活跃 KPanel 任务和 `git worktree list`，确认候选 worktree 未被其他任务使用，且发布范围
只包含协调中心批准的提交。再确认目标版本尚未作为正式 Release 发布、目标镜像标签尚未被占用，
并记录回滚点：

```bash
git fetch origin --tags
git status --short
git rev-parse HEAD
git rev-parse origin/main
git tag --list "v${{version}}"
```

同时检查 GitHub Release、Actions 和 Docker Hub 标签。不得覆盖已经发布的 Release、镜像或
可追溯版本；若版本已占用，必须提升版本号。把 `origin/main` 的提交记为发布基线；
正式推送前若远端已前移，必须停止并重新审计，不得顺带合入其他会话或功能的代码。

在冻结候选前按 `docs/release-acceptance-template.md` 建立发布画像，至少写明：

- 业务域和变更面（展示、只读、宿主机写入、协议/数据、部署）；
- 受影响核心用户旅程和未变化契约；
- 业务正确性、安全、稳定、性能/资源、用户体验、数据/迁移分别需要的证据；
- 哪些危险、付费或耗流量场景只在隔离真机执行，哪些生产动作已获得授权。

**Expected output:** 发布单写者成立，候选提交清单和基线明确，目标版本未占用，记录
`${{previous_version}}` 对应源码和镜像回滚点；发布画像能够解释必测项和不适用维度。

### 2. 准备一致的版本变更

将 `${{version}}` 同步到以下位置，并补充 `CHANGELOG.md`：

- `VERSION`
- `internal/version/version.go`（开发态使用 `${{version}}-dev`）
- `web/package.json`
- `web/package-lock.json`

检查：

```bash
git diff --check
git diff -- VERSION internal/version/version.go web/package.json \
  web/package-lock.json CHANGELOG.md
```

**Expected output:** 所有发行版本字段均为 `${{version}}`，没有空白错误或无关修改。

执行统一检查，禁止只靠人工比对：

```bash
bash scripts/check-version-consistency.sh
```

### 3. 执行 L3 发布前核验

进入本步骤即冻结候选。此后新增功能默认进入下一版本；若候选文件、分支或 `HEAD` 发生任何变化，
本轮 L3 结果作废，必须先按 `docs/project-management.md` 的冲突恢复流程重建候选，再重新核验。

在 Linux、WSL 或 CI 等支持 Bash、Go、Node 和 Docker 的环境执行：

```bash
npm ci --prefix web
make verify-release
docker run --rm \
  -e KPANEL_APP_CONF_TEST_ROOTFS=1 \
  -v "$PWD:/src:ro" \
  bash:5.2.37-alpine3.22@sha256:3bee76a96d86d5d2d5efc7c1c570e5a7c95db22348a26944e0e546fa174e3324 \
  bash /src/packaging/tests/app-conf-lifecycle.sh /src
```

`make verify-release` 必须实际覆盖核心特权包 race、固定摘要 Trivy 源码/最终镜像扫描，以及
最终镜像构建；Release 工作流还必须在 `256 MiB`、`1 CPU`、`128 PID`、非 root、只读根、
`cap-drop ALL` 条件下启动候选镜像。任何一步未执行或失败都不得进入标签和发布阶段。

另外解析 `.github/workflows/ci.yml` 和 `.github/workflows/release.yml`，确认 YAML 有效，并复核：

- Release tag 必须与 `VERSION` 完全一致；
- Release 先保持 draft，镜像成功后才公开；
- 镜像平台包含 `linux/amd64` 和 `linux/arm64`；
- 稳定版本才提升 `latest`；
- Release action 和 Docker action 使用固定提交摘要。

按发布画像补充自动门禁不能代替的证据：受影响性能基准、桌面/窄视口、浅/深色、键盘/焦点、
多语言、失败状态、`kejilion.sh` 双向互通，以及 L2/L3 写路径的失败注入、重启恢复和回滚。
危险或破坏性写操作优先使用隔离真机，不为了生产形式完整主动改变无关业务数据。

**Expected output:** L3 测试、构建、安装安全、应用配置生命周期和工作流静态检查全部通过。

### 4. 提交发布候选并等待 CI

仅暂存发布范围文件，提交后先推送 `release/v${{version}}-candidate`，让 Linux CI
独立验证准确的待发布提交：

```bash
git add VERSION CHANGELOG.md internal/version/version.go \
  web/package.json web/package-lock.json
git commit -m "chore: prepare KPanel ${{version}}"
git push origin HEAD:refs/heads/release/v${{version}}-candidate
```

如果发布工作流本身需要修复，应将 `.github/workflows/release.yml` 纳入同一独立修复提交。
推送候选前再次核对本地 `HEAD`、候选提交清单和 `origin/main`。等待候选 CI 成功，不得只依据
本地测试继续发布。随后再次读取远端 `main`；只有它仍与步骤 1
记录的基线完全一致，才允许安全快进并等待 `main` CI：

```bash
git push origin HEAD:main
```

**Expected output:** 候选与 `main` CI 均成功，远端提交哈希与本地待发布提交一致，未夹带
其他会话的提交。

### 5. 创建不可变版本标签并监控 Release

打标签前第三次核对 `main`、候选和已通过 CI 的提交哈希完全一致，再创建 annotated tag 并推送：

```bash
git tag -a "v${{version}}" -m "KPanel ${{version}}"
git push origin "v${{version}}"
```

持续检查对应 Release run，直到所有步骤完成：

1. 源码验证；
2. Agent 双架构二进制和校验文件；
3. 原生镜像运行时契约；
4. draft GitHub Release；
5. Docker Hub 登录；
6. 多架构版本镜像；
7. 稳定版 `latest` 提升；
8. GitHub Release 正式公开。

**Expected output:** Release workflow 全绿，GitHub Release 为非 draft、非 prerelease。

### 6. 验证 GitHub Release 和 Docker Hub

核对 Release 附件至少包含：

- `kejilion-agent-linux-amd64`
- `kejilion-agent-linux-arm64`
- `kejilion-panel-deploy-${{version}}.tar.gz`
- `SHA256SUMS`

核对 `${{image}}:${{version}}` 与稳定版 `${{image}}:latest` 的清单摘要完全一致，并确认
`linux/amd64`、`linux/arm64` 均存在。额外的 `unknown/unknown` 条目可为 provenance/SBOM
attestation，不能误判为架构缺失。

**Expected output:** Release 附件完整，版本镜像与 `latest` 指向同一摘要，双架构齐全。

### 7. 核对应用市场契约，必要时同步

当前 `kpanel.conf` 使用 `latest`，并从镜像 OCI 标签和内置 `/release/VERSION` 动态校验
Panel/Agent 版本；普通 KPanel 版本发布不再同步硬编码版本。先把本仓库
`packaging/kejilion-app/kpanel.conf` 与 `${{apps_repo}}/kpanel.conf` 归一化对比：

```bash
git diff --quiet "v${{previous_version}}..HEAD" -- \
  packaging/kejilion-app/kpanel.conf
```

- 若安装/更新契约没有变化，记录“无需应用市场提交”，禁止制造空提交；
- 若契约发生变化，只有正式 Release 和镜像验证成功后，才同步配置、运行 Bash 语法和
  生命周期检查，并在 `kejilion/apps` 仓库独立提交推送：

```bash
git add kpanel.conf
git commit -m "chore: update KPanel to ${{version}}"
git push origin HEAD:main
```

**Expected output:** 应用市场配置与发布契约一致；无变化时工作树干净且无提交，有变化时
`kejilion/apps` 的 `main` 已更新且工作树干净。

### 8. 从公开仓库完成最终验收

不得复用本地构建缓存作为线上证据。显式拉取公开镜像并运行端到端测试：

```bash
docker pull "${{image}}:${{version}}"
KPANEL_EXPECTED_VERSION="${{version}}" \
  sh packaging/tests/image-e2e.sh "${{image}}:${{version}}"
```

再次核对 GitHub Release 页面、Actions 结果、Docker Hub 摘要和应用市场契约；只有步骤 7
实际产生配置差异时才核对 `kejilion/apps` 提交。

**Expected output:** 输出 `image_e2e=pass`，Release、Actions 和 Docker Hub 均与
`${{version}}` 一致；应用市场为“同哈希且无需提交”或“配置已同步并提交”。

### 9. 在明确授权范围内完成生产部署与观察

生产操作必须有本次明确授权。部署前记录当前版本、Panel/Agent 健康、镜像摘要、数据/配置位置和
可恢复备份；使用 KPanel 标准应用市场更新入口，不直接改正式数据或绕过安装事务。部署后至少复核：

- 健康接口版本、Panel healthy/重启/OOM、Agent active/重启/协议版本；
- 生产镜像 digest、OCI 源码修订、宿主机 Agent 与正式镜像内二进制摘要；
- 状态文件可解析、数据库完整性、近期日志、权威公网入口和连续健康采样；
- 发布画像中已授权的用户旅程；危险、付费、耗流量或无关写操作继续使用隔离真机证据。

若用户只授权发布正式产物而未授权生产部署，停止在此步骤并明确记录“正式产物已发布，生产未部署/
未验证”，不得复用上一版本生产结果或把公开镜像 E2E 写成生产成功。

**Expected output:** 已授权时生产运行版本与正式 digest/commit 一致、备份和回滚可执行；未授权时没有
生产状态变化且未验证边界清晰。

### 10. 形成统一验收记录并交付

从 `docs/release-acceptance-template.md` 创建 `docs/release-v${{version}}-acceptance.md`，记录精确提交、
发布画像、多维质量状态、候选/主线/Release、公开产物、隔离真机、生产观察、回滚和遗留风险。
自动测试、隔离真机、公开产物和生产观察必须分层填写；生产未执行的管理员写操作不得写成已验证。

记录候选冻结和生产完成时间、提交到生产用时、是否发生回滚/紧急热修复/重复发布及原因，供滚动
14 天和最近 20 个版本的发布节奏复核。验收记录在获得相应提交/推送授权后形成独立聚焦提交；
未获授权时保留工作树差异并回传，不得擅自更新 `main`。

最终回传必须包含：

- 主仓库提交和 tag；
- CI、Release run、GitHub Release、Docker Hub 链接；
- 版本镜像和 `latest` 摘要；
- 支持的平台；
- `kejilion/apps` 契约核对结果，以及有变更时的提交；
- 公开镜像 E2E 结果；
- 多维质量状态、受影响用户旅程和证据层级；
- 生产已验证动作与仅在隔离真机验证的动作；
- 发布节奏数据和重复发布原因（如有）；
- 保留的无关本地改动；
- `${{previous_version}}` 回滚点及任何未验证风险。

**Expected output:** 验收文档结构完整，用户无需查看其他会话即可区分已验证、不适用和未验证风险，
并获得完整、可追溯的发布结论。

## Parameters

- `${{project_dir}}`：本次发布候选所在的独立 KPanel 工作树绝对路径。
- `${{version}}`：不含 `v` 的目标语义版本，例如 `0.20.2`。
- `${{previous_version}}`：发布前稳定源码或镜像版本，用于回滚说明。
- `${{image}}`：完整镜像仓库，默认 `docker.io/kjlion/kejilion-panel`。
- `${{apps_repo}}`：`kejilion/apps` 本地路径，默认 `C:\GitHub\kejilion\apps`。

## Verification

```bash
py -3 C:/Users/Administrator/.codex/skills/codex-workflows/scripts/workflow.py \
  validate release-kpanel --project-dir "${{project_dir}}"
py -3 C:/Users/Administrator/.codex/skills/codex-workflows/scripts/workflow.py \
  run release-kpanel --project-dir "${{project_dir}}" \
  --param project_dir="${{project_dir}}" \
  --param version=0.0.0-test \
  --param previous_version=0.0.0 \
  --param image=docker.io/example/kpanel \
  --param apps_repo=C:/tmp/apps
```

确认渲染结果中不存在未替换参数，并执行 `git diff --check`。

## Notes

- 工作流负责指导执行，不保存 GitHub、Docker Hub Token 或任何会话 ID。
- Release 失败时先定位精确失败步骤；不得把登录成功等同于推送和提升 `latest` 成功。
- 若失败发生在正式产物生成之后，修复后发布新的 patch 版本，不移动或覆盖旧 tag。
- 若仅生成 draft Release，不得手工公开；镜像成功且线上验收通过后才允许公开。
- 高频发布不自动视为失败，也不自动豁免门禁；同一问题的候选冻结前连续微调应尽量聚合，
  冻结后的独立修复使用新 patch 版本并记录原因。
- 源码回滚与镜像回滚分别记录；历史源码 tag 不代表一定存在可用 Docker 镜像。
- 发布 worktree 的分支、`HEAD` 或文件被外部任务改变时立即停止；不得重置他人改动，迁移到新的
  专用候选 worktree 并重新执行受影响门禁。
