<!doctype html>
<html lang="zh-CN" data-panel-origin="{{PANEL_ORIGIN}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KPanel Browser Core</title>
  <link rel="stylesheet" href="/kernel/kernel.css">
</head>
<body>
  <main class="kernel-shell">
    <div id="status" class="kernel-status" role="status" aria-live="polite">
      <span class="kernel-spinner" aria-hidden="true"></span>
      <strong>浏览器内核已就绪</strong>
      <small>等待 KPanel 发送安全会话</small>
    </div>
    <iframe id="viewport" class="kernel-viewport" title="网页内容" sandbox="allow-same-origin"></iframe>
  </main>
  <script src="/kernel/kernel.js" defer></script>
</body>
</html>
